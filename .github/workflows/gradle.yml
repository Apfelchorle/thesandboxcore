name: Java CI with Gradle

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the dependency-submission step
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: |
          chmod +x ./gradlew
          ./gradlew check -Pflavor=sandbox

      - name: Build sandbox flavor
        run: ./gradlew build -Pflavor=sandbox

      - name: Build survival flavor
        run: ./gradlew build -Pflavor=survival

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jars
          path: build/libs/*.jar

  release:
    # Publish only from an explicit v* tag, never from every push to master.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: plugin-jars
          path: plugin-jars

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: plugin-jars/*.jar
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
