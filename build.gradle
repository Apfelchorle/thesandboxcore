plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

// ---------------------------------------------------------------------------
// Build flavors
//
//   ./gradlew build                       -> sandbox (full feature set)
//   ./gradlew build -Pflavor=survival     -> survival (hardened allowlist)
//   ./gradlew survival                    -> shortcut for the survival jar
//
// A flavor is defined in flavors/<name>.properties. "commands", "items" and
// "features" are comma-separated allowlists:
//   "*" -> everything, "" -> nothing, "a,b,c" -> only those entries.
// ---------------------------------------------------------------------------
def requestedTasks = gradle.startParameter.taskNames.collect {
    it.toLowerCase(Locale.ROOT).replaceFirst('^:', '')
}
def flavorFromTask = requestedTasks.any { it in ['survival', 'buildsurvival', 'survivaljar'] }
        ? 'survival'
        : requestedTasks.any { it in ['sandbox', 'buildsandbox', 'sandboxjar'] }
        ? 'sandbox'
        : null
def requestedFlavor = (providers.gradleProperty('flavor').orNull ?: flavorFromTask ?: 'sandbox')
        .toString().trim().toLowerCase(Locale.ROOT)

def flavorsDir = file('flavors')
def flavorFile = new File(flavorsDir, "${requestedFlavor}.properties")
if (!flavorFile.isFile()) {
    def available = flavorsDir.isDirectory()
            ? flavorsDir.listFiles()
                .findAll { it.name.endsWith('.properties') }
                .collect { it.name.substring(0, it.name.length() - '.properties'.length()) }
                .sort()
                .join(', ')
            : ''
    throw new GradleException("Unknown build flavor '${requestedFlavor}'. Available: ${available ?: '(none)'}")
}

def flavorProps = new Properties()
flavorFile.withInputStream { flavorProps.load(it) }

def flavorDisplayName = flavorProps.getProperty('display-name', requestedFlavor).trim()
def flavorArchiveBaseName = flavorProps.getProperty('archive-base-name', 'thesandboxcore').trim()
def flavorCommands = flavorProps.getProperty('commands', '*').trim()
def flavorItems = flavorProps.getProperty('items', '*').trim()
def flavorFeatures = flavorProps.getProperty('features', '*').trim()

println "Gradle build flavor: ${flavorDisplayName} [${requestedFlavor}]"

group = 'org.thesandbox'
version = '1.0.0'
description = 'TheSandboxCore'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }

    maven {
        name = 'lucko'
        url = uri('https://repo.lucko.me/')
    }

    maven {
        name = 'codemc'
        url = uri('https://repo.codemc.org/repository/maven-public/')
    }

    maven {
        name = 'essentialsx'
        url = uri('https://repo.essentialsx.net/releases/')
    }

    maven {
        name = 'playpro'
        url = uri('https://maven.playpro.com/')
    }

    maven {
        name = 'lumine'
        url = uri('https://mvn.lumine.io/repository/maven-public/')
    }

    maven {
        name = 'libsdisguises'
        url = uri('https://mvn.lib.co.nz/public/')
    }

    maven {
        name = 'jitpack'
        url = uri('https://jitpack.io')
    }
}

dependencies {
    // Enforces a single, consistent version across all Netty modules brought in by JDA
    implementation platform('io.netty:netty-bom:4.2.21.Final')
    implementation 'io.netty:netty-all:4.2.21.Final'
    // Paper API and PacketEvents also pull Netty transitively into the compile classpath.
    compileOnly platform('io.netty:netty-bom:4.2.21.Final')

    constraints {
        add('implementation', 'org.codehaus.plexus:plexus-utils:4.0.3') {
            because 'Security patch'
        }
        add('implementation', 'org.apache.commons:commons-lang3:3.22.0') {
            because 'i said so'
        }
        add('implementation', 'com.fasterxml.jackson.core:jackson-core:2.23.0') {
            because 'i said so'
        }
        add('implementation', 'org.apache.logging.log4j:log4j-api:2.26.1') {
            because 'Security patch'
        }
        add('implementation', 'com.google.guava:guava:33.8.0-jre') {
            because 'Security patch'
        }
        add('compileOnly', 'org.apache.logging.log4j:log4j-api:2.26.1') {
            because 'Security patch'
        }
        add('compileOnly', 'com.google.guava:guava:33.8.0-jre') {
            because 'Security patch'
        }
    }

    compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'
    compileOnly 'io.papermc.paper:paper-api:26.3.build.253-stable'
    compileOnly 'net.luckperms:api:5.5'
    compileOnly('net.essentialsx:EssentialsX:2.20.1') {
        exclude group: 'org.spigotmc', module: 'spigot-api'
    }
    compileOnly 'net.skinsrestorer:skinsrestorer-api:15.7.10'
    compileOnly 'me.libraryaddict.disguises:libsdisguises:11.0.13'
    compileOnly 'com.github.LeonMangler:PremiumVanishAPI:2.9.18-2'
    compileOnly 'litebans:api:0.6.1'

    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'com.mysql:mysql-connector-j:26.10.0'

    implementation('net.dv8tion:JDA:6.7.0') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'club.minnced', module: 'opus-java'
    }

    // Extra ImageIO readers for the Discord image-to-ASCII renderer.
    implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.12.0'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
    implementation 'com.twelvemonkeys.imageio:imageio-tiff:3.15.3'
    implementation 'com.twelvemonkeys.imageio:imageio-bmp:3.15.3'
    implementation 'com.twelvemonkeys.imageio:imageio-psd:3.15.3'
    implementation 'com.twelvemonkeys.imageio:imageio-tga:3.12.0'

    // Unit tests. Paper API is only needed so settings records and other
    // classes that mention Bukkit types can be loaded on the test classpath.
    testImplementation 'io.papermc.paper:paper-api:26.3.build.253-stable'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
}

// ---------------------------------------------------------------------------
// Flavor resources
//
// The source plugin.yml stays complete. For each build we generate:
//   - build/generated/flavor/plugin.yml       (disabled commands removed)
//   - build/generated/flavor/flavor.properties (runtime allowlists)
// Both are packaged instead of the source plugin.yml.
// ---------------------------------------------------------------------------
def flavorResourcesDir = layout.buildDirectory.dir('generated/flavor')
def pluginYmlSource = file('src/main/resources/plugin.yml')

def parseFlavorAllowlist = { String raw ->
    String value = (raw ?: '').trim()
    if (value == '*') return null                  // everything
    if (value.isEmpty()) return Collections.<String>emptySet() // nothing
    return new LinkedHashSet<String>(
            value.split(',')
                    .collect { it.trim().toLowerCase(Locale.ROOT) }
                    .findAll { !it.isEmpty() }
    )
}

def readCommandKeys = { File input ->
    Set<String> keys = new LinkedHashSet<>()
    boolean inCommands = false
    for (String line : input.readLines('UTF-8')) {
        if (!inCommands) {
            if (line.trim() == 'commands:') inCommands = true
            continue
        }
        boolean topLevel = !line.isEmpty() && !line.startsWith(' ') && !line.startsWith('#')
        if (topLevel) break
        def matcher = line =~ /^ {2}([A-Za-z0-9_-]+):\s*(?:#.*)?$/
        if (matcher.matches()) {
            keys.add(matcher.group(1).toLowerCase(Locale.ROOT))
        }
    }
    return keys
}

def filterPluginYml = { File input, File output, Set<String> allowed ->
    List<String> lines = input.readLines('UTF-8')
    StringBuilder result = new StringBuilder(lines.size() * 48)
    boolean inCommands = false
    boolean skipping = false

    for (String line : lines) {
        if (!inCommands) {
            if (line.trim() == 'commands:') inCommands = true
            result.append(line).append('\n')
            continue
        }

        boolean topLevel = !line.isEmpty() && !line.startsWith(' ') && !line.startsWith('#')
        if (topLevel) {
            inCommands = false
            skipping = false
            result.append(line).append('\n')
            continue
        }

        if (line.trim().isEmpty()) {
            skipping = false
            result.append(line).append('\n')
            continue
        }

        if (line.startsWith('#')) {
            // Column-0 section comments sit between command blocks; indented
            // comments belong to the block currently being skipped.
            if (!line.startsWith(' ')) skipping = false
            if (!skipping) result.append(line).append('\n')
            continue
        }

        def matcher = line =~ /^ {2}([A-Za-z0-9_-]+):\s*(?:#.*)?$/
        if (matcher.matches()) {
            String key = matcher.group(1).toLowerCase(Locale.ROOT)
            skipping = allowed != null && !allowed.contains(key)
            if (!skipping) result.append(line).append('\n')
            continue
        }

        if (!skipping) result.append(line).append('\n')
    }

    output.setText(result.toString(), 'UTF-8')
}

def generateFlavorResources = tasks.register('generateFlavorResources') {
    group = 'build'
    description = "Generates flavor.properties and a filtered plugin.yml for the '${requestedFlavor}' flavor."

    inputs.file(pluginYmlSource)
    inputs.file(flavorFile)
    inputs.property('flavor', requestedFlavor)
    inputs.property('displayName', flavorDisplayName)
    inputs.property('commands', flavorCommands)
    inputs.property('items', flavorItems)
    inputs.property('features', flavorFeatures)
    outputs.dir(flavorResourcesDir)

    doLast {
        File outDir = flavorResourcesDir.get().asFile
        outDir.mkdirs()

        String propertiesText = [
                '# Generated by build.gradle. Do not edit.',
                "flavor=${requestedFlavor}",
                "display-name=${flavorDisplayName}",
                "commands=${flavorCommands}",
                "items=${flavorItems}",
                "features=${flavorFeatures}",
                ''
        ].join('\n')
        new File(outDir, 'flavor.properties').setText(propertiesText, 'UTF-8')

        Set<String> allowedCommands = (Set<String>) parseFlavorAllowlist(flavorCommands)
        if (allowedCommands != null) {
            Set<String> knownCommands = readCommandKeys(pluginYmlSource)
            List<String> unknown = allowedCommands.findAll { !knownCommands.contains(it) }.sort()
            if (!unknown.isEmpty()) {
                throw new GradleException(
                        "Flavor '${requestedFlavor}' lists command(s) missing from plugin.yml: ${unknown.join(', ')}")
            }
        }

        filterPluginYml(pluginYmlSource, new File(outDir, 'plugin.yml'), allowedCommands)
    }
}

// The source plugin.yml is replaced by the generated one.
sourceSets.main.resources.exclude('plugin.yml')

tasks.named('processResources') {
    dependsOn generateFlavorResources
    //noinspection GrUnresolvedAccess
    from(flavorResourcesDir)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    options.compilerArgs += ['-Xlint:deprecation']
}

tasks.named('jar') {
    enabled = false
}

tasks.named('shadowJar') {
    //noinspection GrUnresolvedAccess
    archiveBaseName.set(flavorArchiveBaseName)
    //noinspection GrUnresolvedAccess
    archiveVersion.set(project.version.toString())
    //noinspection GrUnresolvedAccess
    archiveClassifier.set('')

    //noinspection GrUnresolvedAccess
    exclude 'META-INF/*.SF'
    //noinspection GrUnresolvedAccess
    exclude 'META-INF/*.DSA'
    //noinspection GrUnresolvedAccess
    exclude 'META-INF/*.RSA'

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    //noinspection GrUnresolvedAccess
    mergeServiceFiles()

    //noinspection GrUnresolvedAccess
    relocate 'com.zaxxer.hikari', 'org.thesandbox.libs.hikari'
    //noinspection GrUnresolvedAccess
    relocate 'com.mysql', 'org.thesandbox.libs.mysql'
    //noinspection GrUnresolvedAccess
    relocate 'net.dv8tion.jda', 'org.thesandbox.libs.jda'
    //noinspection GrUnresolvedAccess
    relocate 'okhttp3', 'org.thesandbox.libs.okhttp3'
    //noinspection GrUnresolvedAccess
    relocate 'okio', 'org.thesandbox.libs.okio'
    //noinspection GrUnresolvedAccess
    relocate 'com.fasterxml.jackson', 'org.thesandbox.libs.jackson'
    //noinspection GrUnresolvedAccess
    relocate 'io.netty', 'org.thesandbox.libs.netty'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

// Convenience shortcuts. The task name is picked up at configuration time, so
// `./gradlew survival` builds the same jar as `./gradlew build -Pflavor=survival`.
tasks.register('sandbox') {
    group = 'build'
    description = 'Builds the sandbox flavor jar (same as -Pflavor=sandbox).'
    dependsOn tasks.named('shadowJar')
}

tasks.register('survival') {
    group = 'build'
    description = 'Builds the survival flavor jar (same as -Pflavor=survival).'
    dependsOn tasks.named('shadowJar')
}
