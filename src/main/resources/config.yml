# ============================================================
#  TheSandboxCore configuration
# ============================================================
# This file is created on first start. Existing servers keep their
# current config.yml; missing keys fall back to the defaults in code.
# ============================================================

config-version: 2

# ------------------------------------------------------------
# Database
# ------------------------------------------------------------
# TLS is enabled by default. If your MySQL server does not support
# TLS, set use-ssl to false (traffic will be unencrypted).
mysql:
  sandbox:
    host: ""
    port: 3306
    database: ""
    user: ""
    password: ""
    use-ssl: true
    require-ssl: false
    allow-public-key-retrieval: false

# ------------------------------------------------------------
# Player data
# ------------------------------------------------------------
player-data:
  # Player data is also written on quit. This periodic save protects
  # against crashes that would otherwise lose a whole session.
  save-interval-seconds: 300

# ------------------------------------------------------------
# Worlds
# ------------------------------------------------------------
# Load existing worlds during startup instead of on the first
# teleport. Missing worlds are never generated implicitly.
worlds:
  preload-enabled: true
  preload:
    - world
    - world_nether
    - world_the_end
    - masterbuilderworld
    - flatlands

# ------------------------------------------------------------
# Discord bridge
# ------------------------------------------------------------
discord:
  enabled: false
  invite-url: ""
  # Keep tokens out of this file where possible; use a secrets manager
  # or environment variable and paste the value at deploy time.
  token: ""
  chat-bridge:
    enabled: true

  # Chat art renderer for images/GIFs posted to Discord.
  # style: braille  -> 2x4 subpixels per character (highest detail)
  #        block    -> one block character per pixel
  #        shade    -> block resolution with ░ ▒ ▓ █ gradients
  #        emoji    -> colored circles mapped to luminance
  image-render:
    enabled: true
    staff: true
    public-chat: true
    nsfw: false
    spoilers: false
    thumbnails: true
    width: 40
    height: 22
    char-aspect: 0.9
    style: braille
    palette: hex
    colors: 64
    alpha-threshold: 32
    background: "#1F1F1F"
    timeout-ms: 2000
    cache-size: 128
    max-per-minute: 12
    max-per-author-per-minute: 3
    max-bytes: 8388608
    max-pixels: 20000000
    fetch-size: 256
    debug: false

  # Discord /console safety (sandbox flavor only).
  # Built-in hard blocks: op, deop, stop, restart, reload, execute, sudo,
  # plugincontrol, function, wildcard, loop and friends. These entries add
  # restrictions for commands that are too destructive to expose remotely.
  console:
    # Optional guild ID. Empty = any guild the bot is in.
    guild-id: ""
    blocked-commands:
      - opme
      - config
      - rank
      - updatelocal
      - updateall
      - updateallproxies
      - slowrestart
      - entitywipe
      - cage

# ------------------------------------------------------------
# Updates
# ------------------------------------------------------------
update:
  # Downloads are verified against the SHA-256 digest published by
  # GitHub. Only enable this if a repository does not publish digests.
  allow-unverified: false

# ------------------------------------------------------------
# Trusted UUIDs
# ------------------------------------------------------------
# /opme only works for players whose UUID is listed here AND who have
# the sandbox.opme permission. Name-based fallbacks are intentionally
# disabled because cracked servers allow name impersonation.
trusted-uuids: []

# ------------------------------------------------------------
# Chat filter
# ------------------------------------------------------------
chatfilter:
  blocked-words: []
  regex: false

# ------------------------------------------------------------
# Command limits
# ------------------------------------------------------------
loop:
  max-iterations: 1000

slowrestart:
  max-seconds: 3600
  default-seconds: 60
