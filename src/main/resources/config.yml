# Message formats (MC)
commandspy-format: '&7%player%: %command%'
staffchat-format: '&8[&b&lSTAFF&8]&r &8[%rolecolor%%role%&8] %rolecolor%%name% &8» &f%message%'
staffchat-from-discord-format: '&8[&3&lDISCORD&8] | [&b&lSTAFF&8]&r %role%%rolecolor%%name% &8» &f%message%'

# Discord bridge
discord:
  enabled: true
  token: "PUT_YOUR_DISCORD_BOT_TOKEN_HERE"
  reports-channel-id: "1413974491415183380"
  archived-reports-channel-id: "1413974896920231986"
  channel-id: "1412495873342181446"
  chat-channel-id: "1397608802697740442"
  use-embeds: false
  verified-role-id: "1415327115150360617"
  chat-bridge:
    enabled: true
    member-role-id: "1227366929426157578"
  chat:
    mc-to-discord-format: "**%rank%%player%** » %message%"
    discord-to-mc-format: "%role% %user% &8» &r%message%"
  invite-url: "https://discord.gg/hW62QH3TRc"
mysql:
  host: "localhost"
  port: 3306
  database: "commandspy"
  user: "commandspy"
  password: "PUT_YOUR_MYSQL_PASSWORD_HERE"
  
commandspy:
  blacklist:
    - login
    - register
    - 2fa
    - captcha
    - changepass
    - changepassword
    - cp
    - email
    - l
    - logout
    - reg
    - register
    - totp
    - unreg
    - unregisiter
    - verification
  redact_placeholder: "(REDACTED)"
  format: "&7%player%: %command%"  

tags:
  blacklist:
    - operator
    - op
    - admin
    - administrator
    - staff
    - mb
    - masterbuilder
    - master_builder
    - vip
    
wildcard:
  blocked-commands: [stop, restart, rank, orbit, kick, ban, warn, smite, gtfo]  # e.g. [op, deop, stop, reload]

# SBGuilds settings merged into TheSandboxCore
# Separator between player name and message in guild chat.
chat-separator: "&8»"

# Prefix shown in guild chat (/gchat toggle mode and /gchat <message>).
guild-chat-prefix: "&6[Guild] "

# Actions run when LiteBans warns an online player.

# items config

items:
  lightningrod:
    cooldown: 3000