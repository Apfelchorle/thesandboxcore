# Survival flavor - hardened allowlist for a public survival server.
#
# This list is fail-closed: anything not listed below is removed from
# plugin.yml at build time and is also skipped by the runtime gate. New
# commands therefore stay out of the survival jar until they are added here.
#
# Deliberately excluded:
#   - adventure, creative, survival, spectator, gamemode   (gamemode access)
#   - skull, debugstick, gifmap, shop                      (item creation)
#   - potion, heal, gravity, jumppads, loginmessage        (self-power / item-bound)
#   - world, flatlands, masterbuilderworld, overworld, nether, end (world travel)
#   - opme, devtest, devtoggle, plugincontrol, loop         (debug / privilege escalation)
#   - sudo, wildcard, explode, cage, orbit, expel, rawsay, clearinventory,
#     mediatoggle                                           (high-abuse staff tools)
#   - Discord /console, /uploadschem, /masterbuilder        (features= below)
#
# Discord slash commands are not declared in plugin.yml, so they are gated by
# the "features" list instead. /console would otherwise run any command with
# console authority, including every command removed above.
display-name=Survival (hardened)
archive-base-name=thesurvivalbox

# Comma-separated command allowlist.
commands=chatfilter,coins,discord,dismount,glow,localspawn,marry,marrytag,tag,tagnyan,tagrainbow,colorme,nickgradient,nicknyan,nickrainbow,guild,gchat,list,report,attributelist,player,rank,thesandboxcore,blockcmd,commandspy,config,deafen,denick,disguisetoggle,entitywipe,freeze,goldwipe,gtfo,invisible,kicknoob,managechat,mobpurge,nickclean,potionspy,say,shush,staffchat,waterflow,whohas,autoclear,autotp,aeclear,slowrestart,updateallproxies,updatelocal

# No custom items in the survival build. /shop also needs every item class,
# so leave both disabled unless you want the full shop.
items=

# Nothing extra in the survival build:
#   animated-maps, rideable-dragon            (packet-level extras; see above)
#   discord-console, discord-uploads, discord-masterbuilder (slash commands)
# Enable "animated-maps" only together with the gifmap command; enable
# "rideable-dragon" only together with the stacking-potato item.
features=
