# Sandbox flavor - the full feature set. This is the default build.
display-name=Sandbox (full feature set)
archive-base-name=thesandboxcore

# Comma-separated command allowlist. "*" = every command declared in
# plugin.yml, "" = no commands.
commands=*

# Comma-separated item allowlist. Item ids are the class names without the
# "Item" suffix, in kebab-case:
#   clown-fish, float-boat, grappling-hook, lightning-rod, login-messages,
#   rideable-ender-pearl, stacking-potato, wind-rod
# "*" = all items, "" = none.
items=*

# Comma-separated non-command feature allowlist:
#   animated-maps, rideable-dragon,
#   discord-console       (/console slash command: console-authority dispatch)
#   discord-uploads       (/uploadschem slash command)
#   discord-masterbuilder (/masterbuilder slash command; also needs "rank")
# "features=*" enables all features, "" disables all of them.
features=*
